version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx-shopswift
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-shopswift
    volumes:
      - .:/var/www
    working_dir: /var/www
    env_file:
      - .env

  mysql:
    image: mysql:8.0
    container_name: mysql-shopswift
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ecommerce_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  adminer:
    image: adminer
    container_name: adminer-shopswift
    ports:
      - "8080:8080"

volumes:
  mysql_data: