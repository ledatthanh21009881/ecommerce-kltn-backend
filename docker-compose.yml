version: "3.8"

networks:
  shopswift-network:
    driver: bridge

services:
  nginx:
    image: nginx:latest
    container_name: nginx-shopswift
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - shopswift-network

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-shopswift
    restart: always
    entrypoint: ["/bin/sh", "/var/www/docker/scripts/php-entrypoint.sh"]
    volumes:
      - .:/var/www
    working_dir: /var/www
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - shopswift-network

  mysql:
    image: mysql:8.0
    container_name: mysql-shopswift
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: vivieniedatn2026
      MYSQL_DATABASE: shopswift
      MYSQL_USER: shopswift
      MYSQL_PASSWORD: vivieniedatn2026
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/backups:/backups
    command: --default-authentication-plugin=mysql_native_password --default-time-zone='+07:00'
    networks:
      - shopswift-network

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: websocket-shopswift
    restart: always
    entrypoint: ["/bin/sh", "/var/www/docker/scripts/websocket-entrypoint.sh"]
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
    working_dir: /var/www
    environment:
      - TZ=Asia/Ho_Chi_Minh
    env_file:
      - .env
    depends_on:
      - mysql
    networks:
      - shopswift-network

volumes:
  mysql_data:
